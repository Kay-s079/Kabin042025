<!DOCTYPE html>
<html lang="en">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Margarine&display=swap" rel="stylesheet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Align-Self and Order</title>
    <style>
        html
        {
            color: #554e46;
            font-family: Margarine;
        }
        h1,
        h2 {
            text-align: center;
        }
            #container001 {
            border: 5px dotted #d49fb0;
            background-color: #F7F0DA;
            margin: 1rem;
            display: flex;
            flex-direction: row;
            justify-content:space-around;
            align-items: center;
            height: 700px;

        }
        #one
        {
            background-color:#b6b691;
            order: 1;
            align-self: flex-end;
        }
        #two
        {
            background-color: #6E5E4F;
            order: 0;
        }
        #three
        {
            background-color: #ab8eb3;
            order:0;
        }
        #four{
            background-color: #d49fb0;
            order: 2;
        }
        #five{
            background-color: dimgray;
            order: -1;
            align-self: start;
        }
        .box {
            border: 1px solid black;
            background-color: lightgreen;
            width: 100px;
            height: 100px;
            padding: .5rem;
        }

        @media screen and (min-width:800px) {

            body {
                background-color:#d49fb0;
            }

        }

        @media screen and (min-width:1000px) {

            body {
                background-color:#b6b691;
            }

        }
    
    </style>
</head>

<body>
    <h1>Flexbox</h1>
    <h2>Align-Self and Order</h2>


    <h2>Container001</h2>
    <div id="container001">
        <div class="box" id="one">Item001</div>
        <div class="box" id="two">Item002</div>
        <div class="box" id="three">Item003</div>
        <div class="box" id="four">Item004</div>
        <div class="box" id="five">Item005</div>
    </div>

</body>

</html>
