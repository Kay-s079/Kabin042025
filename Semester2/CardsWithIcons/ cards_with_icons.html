<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cards with Icons</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Just+Another+Hand&family=Pangolin&display=swap" rel="stylesheet">
        <style>
            
            body
            {
                background-color: #dfd2f3;
                color:#73675d;
                font-family: pangolin ;
                line-height: 1.5;
            }
            h1,
            h2{
                text-align: center;
            }
            .fbcards{
                background-color: #9fb193;
                border: 4px solid #73675d;
                padding:1rem;
                max-width: 1200px;
                margin:auto;
                display: flex;
                flex-direction: column;
                gap:1rem
            }
            .cardcircle
            {
                background-color: black;
                width: 70px;
                height: 70px;
                border-radius: 50%;
                display:flex;
                justify-content: center;
                align-items: center;
                font-size:2.5rem;
                margin:auto;
                border:2px solid white;
            }
            .card
            {
                background-color: #dfd2f3;
                border: 2px solid antiquewhite;
                padding:1rem;
                text-align: center;
                border-radius: 15px;
            }
            @media screen and (min-width:700px)
            {
                .fbcards{
                    flex-direction: row;
                }
            }
        </style>
</head>

<body> 
    <h1>Cards with Icons</h1>
    <h2> Font Awesome</h2>
    <section class="fbcards">
        <article class="card">
            <div class="cardcircle">
            <i class="fa-solid fa-shield-dog"></i>
            </div>

        <article class="card">

        </article>

        <article class="card">
            <div class="cardcircle">
                <i class="fa-solid fa-shield-dog"></i>
            </div>
            <h3> Card Header</h3>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Deserunt, non.</p>
        </article>
    </section>
</body>

</html>
